name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *' # UTC 03:00 = 北京时间 11:00，为 08:00 的论文任务留出生成时间
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAPER_DAILY_TOKEN: ${{ secrets.PAPER_DAILY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout daily paper digests
        if: env.PAPER_DAILY_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: vsvnakers/paper-daily
          ref: master
          path: .paper-daily-source
          token: ${{ env.PAPER_DAILY_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - name: Sync paper digests
        if: env.PAPER_DAILY_TOKEN != ''
        run: node scripts/sync-papers.mjs .paper-daily-source/essay_read papers/daily
      - run: npm run build

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .vitepress/dist
